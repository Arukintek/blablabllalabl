<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Отчеты групп — FurAry</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-brand">
        <i class="fa-solid fa-graduation-cap"></i> FurAry
      </div>
      <nav class="nav-links">
        <a href="/admin/dashboard.html">Дашборд</a>
        <a href="/admin/users.html">Пользователи</a>
        <a href="/admin/subjects.html">Предметы</a>
        <a href="/admin/schedule.html">Уроки</a>
        <a href="/admin/reports.html" class="active">Отчеты групп</a>
      </nav>
      <div class="nav-user">
        <button
          id="theme-toggle-btn"
          class="theme-toggle-btn"
          type="button"
          aria-label="Переключить тему"
        >
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="/admin/profile.html" class="user-name">Администратор</a>
        <button id="logout-btn" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <div class="container">
      <!-- Блок выбора группы -->
      <div
        class="card"
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 15px;
        "
      >
        <h2>
          <i class="fa-solid fa-chart-pie"></i> Подробные отчеты успеваемости
        </h2>
        <button id="export-report" class="btn-outline" type="button"><i class="fa-solid fa-file-excel"></i> Экспорт для Excel (.csv)</button>
      </div>

      <div class="card filters-grid">
        <div class="form-group">
          <label for="report-group-select">Группа</label>
          <select id="report-group-select" class="input-text"></select>
        </div>
        <div class="form-group">
          <label for="report-student-select">Ученик</label>
          <select id="report-student-select" class="input-text">
            <option value="all">Все ученики</option>
          </select>
        </div>
        <div class="form-group">
          <label for="report-subject-select">Предмет</label>
          <select id="report-subject-select" class="input-text">
            <option value="all">Все предметы</option>
          </select>
        </div>
      </div>

      <!-- Детальная матрица оценок и посещаемости выбранной группы -->
      <div class="card report-card">
        <h3 id="report-title" style="margin-bottom: 15px; color: #0284c7">
          Выберите группу для просмотра сводки
        </h3>
        <div class="table-scroll report-table-scroll" role="region" aria-label="Таблица оценок группы" tabindex="0">
          <p class="table-scroll-hint">Прокручивайте таблицу по горизонтали; чтобы сократить список оценок, выберите ученика или предмет выше.</p>
          <table id="admin-report-table">
            <thead>
              <tr id="report-thead">
                <th style="min-width: 200px">Студент</th>
                <th style="width: 100px; text-align: center">Ср. балл</th>
              </tr>
            </thead>
            <tbody id="report-tbody">
              <tr>
                <td colspan="2" style="text-align: center; color: #64748b">
                  Выберите группу выше
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/js/demo-data.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-reports.js"></script>
  </body>
</html>
