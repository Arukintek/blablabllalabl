<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление уроками — FurAry</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-brand">
        <i class="fa-solid fa-graduation-cap"></i> FurAry
      </div>
      <nav class="nav-links">
        <a href="/admin/dashboard.html">Дашборд</a>
        <a href="/admin/users.html">Пользователи</a>
        <a href="/admin/subjects.html">Предметы</a>
        <a href="/admin/schedule.html" class="active">Уроки</a>
        <a href="/admin/reports.html">Отчеты групп</a>
      </nav>
      <div class="nav-user">
        <button
          id="theme-toggle-btn"
          class="theme-toggle-btn"
          type="button"
          aria-label="Переключить тему"
        >
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="/admin/profile.html" class="user-name">Администратор</a>
        <button id="logout-btn" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <h2><i class="fa-solid fa-calendar-plus"></i> Добавить новый урок</h2>
        <form
          id="lesson-form"
          style="margin-top: 15px; display: grid; gap: 15px"
        >
          <div class="form-group">
            <label>Группа</label>
            <select id="lesson-group" class="input-text" required>
              <option value="">Нет доступных групп</option>
            </select>
          </div>
          <div class="form-group">
            <label>Тема урока</label>
            <input
              type="text"
              id="lesson-topic"
              class="input-text"
              required
              placeholder="Например: Основы JavaScript"
            />
          </div>
          <!-- Заменили дату на время урока -->
          <div class="form-group">
            <label>Время урока</label>
            <input
              type="text"
              id="lesson-time"
              class="input-text"
              required
              placeholder="Например: 9:00 или 9:00 - 10:20"
            />
          </div>
          <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Создать урок
          </button>
        </form>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/admin-schedule.js"></script>
  </body>
</html>
